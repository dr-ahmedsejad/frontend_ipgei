<svg width="100%" viewBox="0 0 680 560" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Cascade de validation des résultats dans SIGA</title>
<desc>Une note devient un statut V, VCI ou VCS par compensations successives au niveau de l'élément, du module puis du semestre, ce qui détermine si le semestre est admis et ce qui devient une dette.</desc>
<style>
.c-gray{fill:#888780;stroke:#5F5E5A}.c-blue{fill:#4F5BD5;stroke:#26215C}.c-red{fill:#CE4B6E;stroke:#993556}.c-amber{fill:#E08A3C;stroke:#993C1D}.c-green{fill:#1D9E75;stroke:#0F6E56}.c-teal{fill:#1D9E75;stroke:#0F6E56}.c-coral{fill:#D85A30;stroke:#993C1D}.c-purple{fill:#7F77DD;stroke:#3C3489}.c-pink{fill:#D4537E;stroke:#72243E}
text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
</style>
<defs>
<marker id="up" markerWidth="9" markerHeight="9" refX="3" refY="2" orient="auto"><path d="M0,6 L3,0 L6,6 Z" fill="#0F6E56"/></marker>
<marker id="dn" markerWidth="9" markerHeight="9" refX="4" refY="6" orient="auto"><path d="M0,0 L4,6 L8,0 Z" fill="#D85A30"/></marker>
</defs>

<text x="20" y="28" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#26261F">La compensation remonte : note → module → semestre</text>
<text x="20" y="47" font-size="11.5" fill="#5F5E5A">Un élément acquis (V / VCI / VCS) n'est jamais une dette. Tout le reste se repasse.</text>

<text x="20" y="76" font-size="12" font-weight="700" fill="#5F5E5A">NIVEAU 1 · L'ÉLÉMENT — deux seuils bruts</text>
<rect x="20" y="86" width="430" height="58" rx="7" class="c-teal" fill-opacity="0.12" stroke-width="1"/>
<text x="36" y="108" font-size="12" fill="#0F6E56"><tspan font-weight="700">note ≥ 10</tspan>  →  validé directement</text>
<rect x="300" y="94" width="44" height="22" rx="11" class="c-green" fill-opacity="0.3"/><text x="322" y="109" text-anchor="middle" font-size="11" font-weight="700" fill="#0F6E56">V</text>
<text x="36" y="130" font-size="12" fill="#993556"><tspan font-weight="700">note &lt; 6</tspan>  →  éliminatoire, rien ne le sauve</text>
<rect x="300" y="116" width="44" height="22" rx="11" class="c-red" fill-opacity="0.28"/><text x="322" y="131" text-anchor="middle" font-size="11" font-weight="700" fill="#993556">E</text>
<text x="468" y="110" font-size="11" fill="#888780">entre 6 et 10 :</text>
<text x="468" y="126" font-size="11" fill="#888780">sort indécis →</text>

<path d="M235,144 L235,168" fill="none" stroke="#0F6E56" stroke-width="1.4" marker-end="url(#up)"/>
<text x="245" y="161" font-size="10.5" font-style="italic" fill="#0F6E56">moyenne du module</text>

<text x="20" y="190" font-size="12" font-weight="700" fill="#5F5E5A">NIVEAU 2 · LE MODULE — compensation interne (Art. 13)</text>
<rect x="20" y="200" width="430" height="46" rx="7" class="c-teal" fill-opacity="0.16" stroke-width="1"/>
<text x="36" y="222" font-size="12" fill="#0F6E56">élément &lt; 10 mais <tspan font-weight="700">module ≥ 10</tspan>  →  compensé</text>
<text x="36" y="238" font-size="11" fill="#1D9E75">les bons éléments rattrapent les faibles, dans le module</text>
<rect x="392" y="212" width="48" height="22" rx="11" class="c-green" fill-opacity="0.3"/><text x="416" y="227" text-anchor="middle" font-size="11" font-weight="700" fill="#0F6E56">VCI</text>

<path d="M235,246 L235,270" fill="none" stroke="#0F6E56" stroke-width="1.4" marker-end="url(#up)"/>
<text x="245" y="263" font-size="10.5" font-style="italic" fill="#0F6E56">moyenne du semestre</text>

<text x="20" y="292" font-size="12" font-weight="700" fill="#5F5E5A">NIVEAU 3 · LE SEMESTRE — compensation semestrielle (Art. 14)</text>
<rect x="20" y="302" width="430" height="46" rx="7" class="c-teal" fill-opacity="0.2" stroke-width="1.2"/>
<text x="36" y="324" font-size="12" fill="#0F6E56">module entre <tspan font-weight="700">8 et 10</tspan> ET semestre admis  →  compensé</text>
<text x="36" y="340" font-size="11" fill="#1D9E75">le semestre validé sauve un module proche du seuil</text>
<rect x="392" y="314" width="48" height="22" rx="11" class="c-green" fill-opacity="0.3"/><text x="416" y="329" text-anchor="middle" font-size="11" font-weight="700" fill="#0F6E56">VCS</text>

<rect x="478" y="86" width="184" height="262" rx="8" class="c-gray" fill-opacity="0.1" stroke-width="1"/>
<text x="494" y="110" font-size="12" font-weight="700" fill="#444441">est_admis (Art. 15)</text>
<text x="494" y="130" font-size="11.5" fill="#5F5E5A">les 3 à la fois :</text>
<text x="500" y="152" font-size="11.5" fill="#0F6E56">✓ moyenne ≥ 10</text>
<text x="500" y="174" font-size="11.5" fill="#0F6E56">✓ aucun module &lt; 8</text>
<text x="500" y="196" font-size="11.5" fill="#0F6E56">✓ aucun éliminatoire</text>
<line x1="494" y1="212" x2="646" y2="212" stroke="#D3D1C7" stroke-width="1"/>
<text x="494" y="232" font-size="11" fill="#888780">Une bonne moyenne</text>
<text x="494" y="248" font-size="11" fill="#888780">ne suffit PAS : un</text>
<text x="494" y="264" font-size="11" fill="#888780">module &lt; 8 bloque</text>
<text x="494" y="280" font-size="11" fill="#888780">tout le semestre.</text>
<line x1="494" y1="296" x2="646" y2="296" stroke="#D3D1C7" stroke-width="1"/>
<text x="494" y="316" font-size="11" fill="#5F5E5A">seuils : <tspan font-weight="600">6</tspan> élim ·</text>
<text x="494" y="332" font-size="11" fill="#5F5E5A"><tspan font-weight="600">8</tspan> compensable · <tspan font-weight="600">10</tspan> validé</text>

<line x1="20" y1="372" x2="660" y2="372" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="3 3"/>
<text x="20" y="396" font-size="12" font-weight="700" fill="#5F5E5A">LA JONCTION AVEC LES DETTES</text>

<rect x="20" y="408" width="300" height="120" rx="8" class="c-green" fill-opacity="0.14" stroke-width="1.2"/>
<text x="170" y="430" text-anchor="middle" font-size="12" font-weight="700" fill="#0F6E56">ACQUIS — pas de dette</text>
<g font-size="11" fill="#0F6E56">
<rect x="44" y="444" width="44" height="22" rx="11" class="c-green" fill-opacity="0.3"/><text x="66" y="459" text-anchor="middle" font-weight="700">V</text>
<rect x="140" y="444" width="48" height="22" rx="11" class="c-green" fill-opacity="0.3"/><text x="164" y="459" text-anchor="middle" font-weight="700">VCI</text>
<rect x="236" y="444" width="48" height="22" rx="11" class="c-green" fill-opacity="0.3"/><text x="260" y="459" text-anchor="middle" font-weight="700">VCS</text>
</g>
<text x="170" y="490" text-anchor="middle" font-size="11" fill="#1D9E75">validé direct, par module, ou par semestre</text>
<text x="170" y="512" text-anchor="middle" font-size="11" fill="#1D9E75">→ l'étudiant ne le repasse jamais</text>

<rect x="360" y="408" width="300" height="120" rx="8" class="c-coral" fill-opacity="0.14" stroke-width="1.2"/>
<text x="510" y="430" text-anchor="middle" font-size="12" font-weight="700" fill="#993C1D">DETTE — à repasser</text>
<g font-size="11" fill="#993C1D">
<rect x="392" y="444" width="44" height="22" rx="11" class="c-coral" fill-opacity="0.3"/><text x="414" y="459" text-anchor="middle" font-weight="700">E</text>
<rect x="470" y="444" width="48" height="22" rx="11" class="c-coral" fill-opacity="0.3"/><text x="494" y="459" text-anchor="middle" font-weight="700">NV</text>
<rect x="552" y="444" width="52" height="22" rx="11" class="c-coral" fill-opacity="0.3"/><text x="578" y="459" text-anchor="middle" font-weight="700">NVO</text>
</g>
<text x="510" y="490" text-anchor="middle" font-size="11" fill="#D85A30">non validé → est_dette = True l'année suivante</text>
<text x="510" y="512" text-anchor="middle" font-size="11" fill="#D85A30">reporté par _reinscrire_dettes()</text>

<path d="M235,348 L235,388 L150,388 L150,406" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#up)"/>
<path d="M235,388 L510,388 L510,406" fill="none" stroke="#D85A30" stroke-width="1.2" marker-end="url(#dn)"/>
</svg>
