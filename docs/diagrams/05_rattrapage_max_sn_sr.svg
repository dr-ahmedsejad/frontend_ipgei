<svg width="100%" viewBox="0 0 680 480" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Logique du rattrapage dans SIGA — note la plus favorable (Art. 18)</title>
<desc>Au rattrapage seul l'examen est repassé, le contrôle continu et les TP sont hérités de la session normale ; la note retenue est le maximum des deux notes, et un étudiant absent au rattrapage conserve sa note normale.</desc>
<style>
.c-gray{fill:#888780;stroke:#5F5E5A}.c-amber{fill:#E08A3C;stroke:#993C1D}.c-green{fill:#1D9E75;stroke:#0F6E56}.c-teal{fill:#1D9E75;stroke:#0F6E56}
text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
</style>
<defs>
<marker id="a5" markerWidth="10" markerHeight="10" refX="4" refY="7" orient="auto"><path d="M0,0 L4,7 L8,0 Z" fill="#5F5E5A"/></marker>
<marker id="r5" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#993C1D"/></marker>
</defs>

<text x="20" y="28" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#26261F">Rattrapage — la note la plus favorable (Art. 18)</text>
<text x="20" y="47" font-size="11.5" fill="#5F5E5A">Seul l'examen est repassé. CC et TP de la session normale sont conservés. Exemple : EM sans TP, CC×2 / EXAM×3.</text>

<rect x="20" y="66" width="300" height="118" rx="8" class="c-teal" fill-opacity="0.14" stroke-width="1.2"/>
<text x="170" y="90" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0F6E56">SESSION NORMALE (SN)</text>
<g font-size="11" font-weight="600">
<rect x="58" y="102" width="84" height="24" rx="12" class="c-teal" fill-opacity="0.28"/><text x="100" y="118" text-anchor="middle" fill="#0F6E56">CC = 11</text>
<rect x="152" y="102" width="110" height="24" rx="12" class="c-teal" fill-opacity="0.28"/><text x="207" y="118" text-anchor="middle" fill="#0F6E56">EXAM = 5</text>
</g>
<text x="170" y="150" text-anchor="middle" font-size="11.5" fill="#444441">me_sn = (11×2 + 5×3) / 5</text>
<text x="170" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#993C1D">= 7,40 — non validé</text>

<rect x="360" y="66" width="300" height="118" rx="8" class="c-amber" fill-opacity="0.16" stroke-width="1.2"/>
<text x="510" y="90" text-anchor="middle" font-size="12.5" font-weight="700" fill="#993C1D">SESSION RATTRAPAGE (SR)</text>
<g font-size="11" font-weight="600">
<rect x="398" y="102" width="100" height="24" rx="12" class="c-gray" fill-opacity="0.18"/><text x="448" y="118" text-anchor="middle" fill="#5F5E5A">CC hérité 11</text>
<rect x="508" y="102" width="114" height="24" rx="12" class="c-amber" fill-opacity="0.3"/><text x="565" y="118" text-anchor="middle" fill="#993C1D">EXAM = 13</text>
</g>
<text x="510" y="150" text-anchor="middle" font-size="11.5" fill="#444441">me_rat = (11×2 + 13×3) / 5</text>
<text x="510" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#0F6E56">= 12,20</text>

<path d="M320,114 L356,114" fill="none" stroke="#993C1D" stroke-width="1.4" marker-end="url(#r5)"/>
<text x="338" y="104" text-anchor="middle" font-size="9.5" font-style="italic" fill="#993C1D">héritage</text>

<path d="M170,184 L170,216 L320,216" fill="none" stroke="#5F5E5A" stroke-width="1.3"/>
<path d="M510,184 L510,216 L360,216" fill="none" stroke="#5F5E5A" stroke-width="1.3"/>
<path d="M340,216 L340,228" fill="none" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#a5)"/>

<rect x="120" y="232" width="440" height="96" rx="8" class="c-gray" fill-opacity="0.1" stroke-width="1"/>
<text x="340" y="256" text-anchor="middle" font-size="12.5" font-weight="700" fill="#444441">L'étudiant a-t-il passé l'examen de rattrapage ?</text>
<text x="146" y="282" font-size="11.5" fill="#444441"><tspan font-weight="700" fill="#993C1D">NON</tspan> (absent) → note_finale = me_sn — le rattrapage ne pénalise jamais</text>
<text x="146" y="306" font-size="11.5" fill="#444441"><tspan font-weight="700" fill="#0F6E56">OUI</tspan> → note_finale = <tspan font-weight="700">max(me_sn, me_rat)</tspan> = max(7,40 ; 12,20)</text>

<path d="M340,328 L340,346" fill="none" stroke="#0F6E56" stroke-width="1.4" marker-end="url(#a5)"/>

<rect x="140" y="350" width="400" height="56" rx="8" class="c-green" fill-opacity="0.18" stroke-width="1.3"/>
<text x="340" y="373" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0F6E56">note_finale = 12,20 — source SR</text>
<text x="340" y="393" text-anchor="middle" font-size="10.5" fill="#1D9E75">est_valide = True · code V — la note retenue ne peut jamais baisser</text>

<text x="20" y="438" font-size="11" fill="#888780">Côté PV : me_retenue ne bascule sur SR que si la session de rattrapage est CLÔTURÉE (pv_enrichment.py).</text>
<text x="20" y="456" font-size="11" fill="#888780">me_sr = None si l'étudiant n'a pas passé le rattrapage — distinct de « SR égale à SN ».</text>
</svg>
