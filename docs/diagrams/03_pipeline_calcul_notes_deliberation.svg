<svg width="100%" viewBox="0 0 680 700" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Pipeline de calcul des notes et de délibération dans SIGA</title>
<desc>La note d'un élément est agrégée en moyenne de module, puis de semestre, puis d'année, chaque étage produisant des codes de validation ; la délibération transforme ces résultats en décisions.</desc>
<style>
.c-gray{fill:#888780;stroke:#5F5E5A}.c-blue{fill:#4F5BD5;stroke:#26215C}.c-red{fill:#CE4B6E;stroke:#993556}.c-amber{fill:#E08A3C;stroke:#993C1D}.c-green{fill:#1D9E75;stroke:#0F6E56}.c-teal{fill:#1D9E75;stroke:#0F6E56}.c-coral{fill:#D85A30;stroke:#993C1D}.c-purple{fill:#7F77DD;stroke:#3C3489}.c-pink{fill:#D4537E;stroke:#72243E}
text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
</style>
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="4" refY="7" orient="auto"><path d="M0,0 L4,7 L8,0 Z" fill="#1D9E75"/></marker>
</defs>

<text x="20" y="28" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#26261F">Pipeline de calcul — de l'épreuve à la décision</text>
<text x="20" y="47" font-size="11.5" fill="#5F5E5A">Chaque étage consomme le précédent. L'ordre est strict : éléments → modules → semestres → année → délibération.</text>

<rect x="20" y="60" width="640" height="46" rx="7" class="c-gray" fill-opacity="0.12" stroke-width="1"/>
<text x="40" y="79" font-size="11.5" font-weight="700" fill="#444441">SAISIE enseignant</text>
<text x="40" y="96" font-size="11" fill="#5F5E5A">3 composantes, pondérations institutionnelles (singleton)</text>
<g font-size="11" font-weight="700">
<rect x="378" y="71" width="80" height="24" rx="12" class="c-teal" fill-opacity="0.25"/><text x="418" y="87" text-anchor="middle" fill="#0F6E56">CC × 2</text>
<rect x="466" y="71" width="92" height="24" rx="12" class="c-teal" fill-opacity="0.25"/><text x="512" y="87" text-anchor="middle" fill="#0F6E56">EXAM × 3</text>
<rect x="566" y="71" width="76" height="24" rx="12" class="c-teal" fill-opacity="0.25"/><text x="604" y="87" text-anchor="middle" fill="#0F6E56">TP × 1</text>
</g>
<path d="M340,106 L340,118" fill="none" stroke="#1D9E75" stroke-width="1.4" marker-end="url(#a)"/>

<rect x="20" y="124" width="640" height="78" rx="8" class="c-teal" fill-opacity="0.1" stroke-width="1"/>
<circle cx="46" cy="150" r="14" class="c-teal" fill-opacity="0.35"/><text x="46" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#0F6E56">1</text>
<text x="72" y="148" font-size="13" font-weight="700" fill="#0F6E56">NOTE ÉLÉMENT (EM)</text>
<text x="72" y="170" font-size="12" fill="#444441">note = (CC×2 + EXAM×3 + TP×1) / 6        (sans TP : / 5)</text>
<text x="72" y="190" font-size="11" fill="#888780">absent à l'épreuve = 0/20   ·   rattrapage = max(normale, rattrapage)  — Art. 18</text>
<rect x="500" y="138" width="148" height="50" rx="6" class="c-gray" fill-opacity="0.12"/>
<text x="574" y="156" text-anchor="middle" font-size="10.5" font-weight="600" fill="#5F5E5A">→ ResultatElement</text>
<text x="574" y="173" text-anchor="middle" font-size="10.5" fill="#888780">seuils : 6 élim · 10 validé</text>
<path d="M340,202 L340,214" fill="none" stroke="#1D9E75" stroke-width="1.4" marker-end="url(#a)"/>

<rect x="20" y="220" width="640" height="74" rx="8" class="c-teal" fill-opacity="0.13" stroke-width="1"/>
<circle cx="46" cy="246" r="14" class="c-teal" fill-opacity="0.4"/><text x="46" y="251" text-anchor="middle" font-size="14" font-weight="700" fill="#0F6E56">2</text>
<text x="72" y="244" font-size="13" font-weight="700" fill="#0F6E56">MODULE</text>
<text x="72" y="266" font-size="12" fill="#444441">moy = Σ(note_EM × coeff) / Σ coeff     ·  validé si ≥ 10 et aucun éliminatoire</text>
<text x="72" y="285" font-size="11" fill="#888780">compensation interne (Art. 13)</text>
<g font-size="10.5" font-weight="700">
<rect x="368" y="274" width="40" height="20" rx="10" class="c-green" fill-opacity="0.3"/><text x="388" y="288" text-anchor="middle" fill="#0F6E56">V</text>
<rect x="414" y="274" width="48" height="20" rx="10" class="c-green" fill-opacity="0.3"/><text x="438" y="288" text-anchor="middle" fill="#0F6E56">VCI</text>
</g>
<rect x="500" y="232" width="148" height="40" rx="6" class="c-gray" fill-opacity="0.12"/>
<text x="574" y="256" text-anchor="middle" font-size="10.5" font-weight="600" fill="#5F5E5A">→ ResultatModule</text>
<path d="M340,294 L340,306" fill="none" stroke="#1D9E75" stroke-width="1.4" marker-end="url(#a)"/>

<rect x="20" y="312" width="640" height="98" rx="8" class="c-teal" fill-opacity="0.18" stroke-width="1.2"/>
<circle cx="46" cy="338" r="14" class="c-teal" fill-opacity="0.45"/><text x="46" y="343" text-anchor="middle" font-size="14" font-weight="700" fill="#0F6E56">3</text>
<text x="72" y="336" font-size="13" font-weight="700" fill="#0F6E56">SEMESTRE — MGS</text>
<text x="72" y="357" font-size="12" fill="#444441">MGS = Σ(note_EM × coeff) / Σ coeff      (sur les EM, comme le relevé)</text>
<text x="72" y="379" font-size="11.5" font-weight="700" fill="#993556">est_admis (Art. 15), les 3 à la fois :</text>
<text x="80" y="398" font-size="11" fill="#0F6E56">① MGS ≥ 10      ② aucun module &lt; 8      ③ aucun éliminatoire</text>
<rect x="500" y="324" width="148" height="44" rx="6" class="c-green" fill-opacity="0.22"/>
<text x="574" y="342" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0F6E56">code VCS</text>
<text x="574" y="358" text-anchor="middle" font-size="10" fill="#1D9E75">module 8–10 + admis</text>
<path d="M340,410 L340,422" fill="none" stroke="#1D9E75" stroke-width="1.4" marker-end="url(#a)"/>

<rect x="20" y="428" width="640" height="66" rx="8" class="c-teal" fill-opacity="0.1" stroke-width="1"/>
<circle cx="46" cy="454" r="14" class="c-teal" fill-opacity="0.35"/><text x="46" y="459" text-anchor="middle" font-size="14" font-weight="700" fill="#0F6E56">4</text>
<text x="72" y="452" font-size="13" font-weight="700" fill="#0F6E56">ANNÉE</text>
<text x="72" y="474" font-size="12" fill="#444441">moy_annuelle = Σ(moy_sem × crédits) / Σ crédits    ·   taux = crédits / 60 × 100</text>
<text x="72" y="490" font-size="11" fill="#888780">consolidation par semestre : rattrapage clôturé prioritaire, sinon normale (pas de double-comptage)</text>
<path d="M340,494 L340,506" fill="none" stroke="#1D9E75" stroke-width="1.4" marker-end="url(#a)"/>

<rect x="20" y="512" width="312" height="166" rx="8" class="c-amber" fill-opacity="0.14" stroke-width="1.2"/>
<text x="36" y="534" font-size="12.5" font-weight="700" fill="#993C1D">DÉLIBÉRATION SEMESTRIELLE</text>
<text x="36" y="554" font-size="11" fill="#D85A30">peupler → décisions → obligations</text>
<text x="36" y="578" font-size="11.5" fill="#444441"><tspan font-weight="700">admis</tspan> si est_admis · sinon <tspan font-weight="700">ajourné</tspan></text>
<text x="36" y="596" font-size="11" fill="#888780">(rachat jury jamais écrasé)</text>
<text x="36" y="620" font-size="11.5" font-weight="700" fill="#993556">Obligations (Art. 17) :</text>
<text x="44" y="638" font-size="11" fill="#444441">E → obligatoire</text>
<text x="44" y="655" font-size="11" fill="#444441">NV module &lt; 8 → obligatoire</text>
<text x="44" y="672" font-size="11" fill="#444441">NV module 8–10 → facultatif</text>

<rect x="348" y="512" width="312" height="166" rx="8" class="c-amber" fill-opacity="0.2" stroke-width="1.2"/>
<text x="364" y="534" font-size="12.5" font-weight="700" fill="#993C1D">DÉLIBÉRATION ANNUELLE</text>
<text x="364" y="554" font-size="11" fill="#D85A30">regarde les crédits, pas les notes</text>
<text x="372" y="578" font-size="11.5" fill="#444441"><tspan font-weight="700">passage de droit</tspan> — 60 crédits</text>
<text x="372" y="597" font-size="11.5" fill="#444441"><tspan font-weight="700">passage conditionnel</tspan> — ≥ 65 % (+ dettes)</text>
<text x="372" y="616" font-size="11.5" fill="#444441"><tspan font-weight="700">redoublement</tspan> — 1er échec</text>
<text x="372" y="635" font-size="11.5" fill="#444441"><tspan font-weight="700">exclusion</tspan> — 2e échec (Art. 22)</text>
<text x="364" y="660" font-size="10.5" fill="#888780">garde-fous : verrou L3 · année blanche (droit</text>
<text x="364" y="674" font-size="10.5" fill="#888780">préservé) · PFE ≥ 12 (ingénieur)</text>
</svg>
