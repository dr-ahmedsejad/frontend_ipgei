<svg width="100%" viewBox="0 0 680 600" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Processus d'inscription SIGA</title>
<desc>Quatre portes d'entrée convergent vers l'inscription administrative, qui déclenche une cascade pédagogique en trois niveaux ; le passage d'année relie délibération, tampon Progression et réinscription.</desc>
<style>
.c-gray{fill:#888780;stroke:#5F5E5A}.c-blue{fill:#4F5BD5;stroke:#26215C}.c-red{fill:#CE4B6E;stroke:#993556}.c-amber{fill:#E08A3C;stroke:#993C1D}.c-green{fill:#1D9E75;stroke:#0F6E56}.c-teal{fill:#1D9E75;stroke:#0F6E56}.c-coral{fill:#D85A30;stroke:#993C1D}.c-purple{fill:#7F77DD;stroke:#3C3489}.c-pink{fill:#D4537E;stroke:#72243E}
text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
</style>
<defs>
<marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#888780"/></marker>
<marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#0F6E56"/></marker>
</defs>

<text x="20" y="28" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#26261F">Le parcours d'une inscription dans SIGA</text>

<text x="20" y="52" font-size="12" font-weight="600" fill="#5F5E5A">1 · QUATRE PORTES D'ENTRÉE</text>

<g font-size="11.5">
<rect x="15" y="62" width="150" height="46" rx="6" class="c-purple" fill-opacity="0.18" stroke-width="1"/>
<text x="90" y="82" text-anchor="middle" font-weight="600" fill="#3C3489">Préinscription</text>
<text x="90" y="98" text-anchor="middle" fill="#534AB7">candidat en ligne</text>

<rect x="180" y="62" width="150" height="46" rx="6" class="c-blue" fill-opacity="0.18" stroke-width="1"/>
<text x="255" y="82" text-anchor="middle" font-weight="600" fill="#26215C">Import Excel</text>
<text x="255" y="98" text-anchor="middle" fill="#534AB7">fichier MESRS</text>

<rect x="345" y="62" width="150" height="46" rx="6" class="c-blue" fill-opacity="0.18" stroke-width="1"/>
<text x="420" y="82" text-anchor="middle" font-weight="600" fill="#26215C">Formulaire</text>
<text x="420" y="98" text-anchor="middle" fill="#534AB7">saisie manuelle</text>

<rect x="510" y="62" width="155" height="46" rx="6" class="c-amber" fill-opacity="0.18" stroke-width="1"/>
<text x="587" y="82" text-anchor="middle" font-weight="600" fill="#993C1D">Réinscription auto</text>
<text x="587" y="98" text-anchor="middle" fill="#D85A30">passage d'année</text>
</g>

<path d="M90,108 L90,140 L300,140" fill="none" stroke="#888780" stroke-width="1.3"/>
<path d="M255,108 L255,140" fill="none" stroke="#888780" stroke-width="1.3"/>
<path d="M420,108 L420,140 L340,140" fill="none" stroke="#888780" stroke-width="1.3"/>
<path d="M587,108 L587,140 L340,140" fill="none" stroke="#888780" stroke-width="1.3"/>
<path d="M320,140 L320,160" fill="none" stroke="#888780" stroke-width="1.3" marker-end="url(#ar)"/>

<text x="20" y="184" font-size="12" font-weight="600" fill="#5F5E5A">2 · LE DOSSIER (1 par étudiant / an)</text>

<rect x="190" y="192" width="260" height="48" rx="7" class="c-green" fill-opacity="0.2" stroke-width="1.5"/>
<text x="320" y="213" text-anchor="middle" font-size="13" font-weight="700" fill="#0F6E56">InscriptionAdministrative</text>
<text x="320" y="230" text-anchor="middle" font-size="11" fill="#0F6E56">étudiant + filière + année · frais · matricule</text>

<text x="460" y="218" font-size="10.5" fill="#5F5E5A">unique :</text>
<text x="460" y="232" font-size="10.5" fill="#5F5E5A">(étudiant, année)</text>

<path d="M320,240 L320,266" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arg)"/>
<text x="332" y="258" font-size="10.5" font-style="italic" fill="#0F6E56">creer_inscriptions_pedagogiques()</text>

<text x="20" y="290" font-size="12" font-weight="600" fill="#5F5E5A">3 · LA CASCADE PÉDAGOGIQUE (déroulée automatiquement)</text>

<rect x="120" y="300" width="440" height="44" rx="6" class="c-teal" fill-opacity="0.16" stroke-width="1"/>
<text x="140" y="322" font-size="12" font-weight="600" fill="#0F6E56">InscriptionPedagogique</text>
<text x="140" y="337" font-size="10.5" fill="#1D9E75">un objet par semestre (S1, S2…)</text>
<rect x="455" y="312" width="92" height="22" rx="11" class="c-teal" fill-opacity="0.3"/>
<text x="501" y="327" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0F6E56">×2 / an</text>

<path d="M320,344 L320,360" fill="none" stroke="#1D9E75" stroke-width="1.3" marker-end="url(#arg)"/>

<rect x="150" y="362" width="380" height="44" rx="6" class="c-teal" fill-opacity="0.1" stroke-width="1"/>
<text x="170" y="384" font-size="12" font-weight="600" fill="#0F6E56">InscriptionElement</text>
<text x="170" y="399" font-size="10.5" fill="#1D9E75">un objet par enseignement (EM)</text>
<rect x="438" y="374" width="78" height="22" rx="11" class="c-teal" fill-opacity="0.3"/>
<text x="477" y="389" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0F6E56">×N</text>

<rect x="540" y="362" width="125" height="44" rx="6" class="c-coral" fill-opacity="0.16" stroke-width="1"/>
<text x="602" y="381" text-anchor="middle" font-size="10.5" font-weight="600" fill="#993C1D">flag est_dette</text>
<text x="602" y="396" text-anchor="middle" font-size="10" fill="#D85A30">si rattrapage</text>
<path d="M530,384 L538,384" fill="none" stroke="#D85A30" stroke-width="1.2"/>

<line x1="20" y1="430" x2="660" y2="430" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="3 3"/>
<text x="20" y="454" font-size="12" font-weight="600" fill="#5F5E5A">4 · LE PASSAGE D'ANNÉE (deux temps, un tampon)</text>

<g font-size="11.5">
<rect x="15" y="464" width="150" height="50" rx="6" class="c-gray" fill-opacity="0.14" stroke-width="1"/>
<text x="90" y="485" text-anchor="middle" font-weight="600" fill="#444441">Délibération</text>
<text x="90" y="501" text-anchor="middle" font-size="10.5" fill="#5F5E5A">PV annuel clos</text>

<rect x="265" y="464" width="150" height="50" rx="6" class="c-amber" fill-opacity="0.2" stroke-width="1.3"/>
<text x="340" y="485" text-anchor="middle" font-weight="700" fill="#993C1D">Progression</text>
<text x="340" y="501" text-anchor="middle" font-size="10.5" fill="#D85A30">tampon modifiable</text>

<rect x="515" y="464" width="150" height="50" rx="6" class="c-green" fill-opacity="0.2" stroke-width="1.3"/>
<text x="590" y="485" text-anchor="middle" font-weight="700" fill="#0F6E56">Réinscription N+1</text>
<text x="590" y="501" text-anchor="middle" font-size="10.5" fill="#1D9E75">inscription effective</text>
</g>
<path d="M165,489 L262,489" fill="none" stroke="#888780" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="213" y="481" text-anchor="middle" font-size="9.5" font-style="italic" fill="#5F5E5A">generer()</text>
<path d="M415,489 L512,489" fill="none" stroke="#888780" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="463" y="481" text-anchor="middle" font-size="9.5" font-style="italic" fill="#5F5E5A">executer()</text>

<text x="20" y="540" font-size="11" font-weight="600" fill="#5F5E5A">5 décisions :</text>
<g font-size="10.5">
<rect x="92" y="530" width="96" height="22" rx="11" class="c-green" fill-opacity="0.22"/><text x="140" y="545" text-anchor="middle" fill="#0F6E56">progression</text>
<rect x="196" y="530" width="100" height="22" rx="11" class="c-amber" fill-opacity="0.22"/><text x="246" y="545" text-anchor="middle" fill="#993C1D">redoublement</text>
<rect x="304" y="530" width="100" height="22" rx="11" class="c-amber" fill-opacity="0.22"/><text x="354" y="545" text-anchor="middle" fill="#993C1D">année blanche</text>
<rect x="412" y="530" width="92" height="22" rx="11" class="c-blue" fill-opacity="0.22"/><text x="458" y="545" text-anchor="middle" fill="#26215C">diplomation</text>
<rect x="512" y="530" width="86" height="22" rx="11" class="c-red" fill-opacity="0.22"/><text x="555" y="545" text-anchor="middle" fill="#993556">exclusion</text>
</g>
<text x="92" y="572" font-size="10" fill="#888780">progression/redoublement/année blanche → créent une inscription · diplomation/exclusion → flag étudiant, pas d'inscription</text>
</svg>
